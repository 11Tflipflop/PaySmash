name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pay
          POSTGRES_PASSWORD: pay
          POSTGRES_DB: payengine_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pay:pay@localhost:5432/payengine_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
